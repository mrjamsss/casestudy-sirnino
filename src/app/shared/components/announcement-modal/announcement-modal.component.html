<div class="modal-content">
    <div class="modal-header">
        <div>
            <h2>{{ isEdit ? 'Edit Announcement' : 'Create New Announcement' }}</h2>
            <span class="subtitle">{{ isEdit ? 'Update announcement details' : 'Post updates visible to selected
                audience' }}</span>
        </div>
        <ion-button fill="clear" (click)="dismiss()">
            <ion-icon slot="icon-only" name="close"></ion-icon>
        </ion-button>
    </div>

    <div class="modal-body">
        <form class="announcement-form">
            <!-- Title Input -->
            <div class="form-group">
                <label>Title <span class="required">*</span></label>
                <ion-input [(ngModel)]="title" name="title" placeholder="Enter announcement title"
                    class="custom-input"></ion-input>
            </div>

            <!-- Type Select -->
            <div class="form-group">
                <label>Type <span class="required">*</span></label>
                <ion-select [(ngModel)]="type" name="type" placeholder="Select type" interface="popover"
                    [interfaceOptions]="customPopoverOptions" class="custom-select">
                    <ion-select-option *ngFor="let typeOption of announcementTypes" [value]="typeOption.value">
                        {{ typeOption.label }}
                    </ion-select-option>
                </ion-select>
            </div>

            <!-- Audience Selection -->
            <div class="form-group">
                <label>Audience <span class="required">*</span></label>
                <div class="audience-options">
                    <div *ngFor="let option of audienceOptions" class="audience-option"
                        [class.selected]="audience === option.value" (click)="audience = option.value">
                        <div class="option-header">
                            <div class="option-icon">
                                <ion-icon [name]="option.icon"></ion-icon>
                            </div>
                            <span class="option-label">{{ option.label }}</span>
                        </div>
                        <p class="option-description">{{ option.description }}</p>
                    </div>
                </div>
            </div>

            <!-- Description Textarea -->
            <div class="form-group">
                <label>Description <span class="required">*</span></label>
                <ion-textarea [(ngModel)]="description" name="description"
                    placeholder="Write detailed description here..." class="custom-textarea"
                    [autoGrow]="true"></ion-textarea>
            </div>
        </form>
    </div>

    <div class="modal-footer">
        <ion-button class="cancel-btn" fill="outline" (click)="dismiss()">
            Cancel
        </ion-button>
        <ion-button class="save-btn" (click)="save()" [disabled]="!isFormValid()">
            <ion-icon slot="start" [name]="isEdit ? 'checkmark-circle' : 'add-circle'"></ion-icon>
            {{ isEdit ? 'Update' : 'Create' }} Announcement
        </ion-button>
    </div>
</div>
