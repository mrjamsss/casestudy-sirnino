<ion-header>
    <ion-toolbar>
        <ion-title>{{ departmentData ? 'Edit' : 'Add' }} Department</ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="dismiss()">
                <ion-icon name="close"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<div class="ion-padding scrollable-content">
    <form #deptForm="ngForm">
        <ion-list>
            <ion-list-header>
                <ion-label>Department Information</ion-label>
            </ion-list-header>

            <ion-item>
                <ion-label position="stacked">Department Name *</ion-label>
                <ion-input [(ngModel)]="formData.name" name="name" placeholder="Enter department name" required>
                </ion-input>
            </ion-item>

            <ion-item>
                <ion-label position="stacked">Description *</ion-label>
                <ion-textarea [(ngModel)]="formData.description" name="description" placeholder="Enter description"
                    rows="4" required>
                </ion-textarea>
            </ion-item>
        </ion-list>
    </form>
</div>

<ion-footer>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-button (click)="dismiss()" fill="clear">Cancel</ion-button>
        </ion-buttons>
        <ion-buttons slot="end">
            <ion-button (click)="save()" [disabled]="!isFormValid()" color="primary" fill="solid">
                <ion-icon name="save-outline" slot="start"></ion-icon>
                Save Department
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-footer>
