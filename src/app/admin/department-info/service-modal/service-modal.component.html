<ion-header>
    <ion-toolbar>
        <ion-title>{{ serviceData ? 'Edit' : 'Add' }} Service</ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="dismiss()">
                <ion-icon name="close"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<div class="ion-padding scrollable-content">
    <form #serviceForm="ngForm">
        <!-- Basic Information -->
        <ion-list>
            <ion-list-header>
                <ion-label>Service Information</ion-label>
            </ion-list-header>

            <ion-item>
                <ion-label position="stacked">Service Name *</ion-label>
                <ion-input [(ngModel)]="formData.name" name="name" placeholder="Enter service name" required>
                </ion-input>
            </ion-item>

            <ion-item>
                <ion-label position="stacked">Service Type *</ion-label>
                <ion-select [(ngModel)]="formData.type" name="type" placeholder="Select type" required
                    interface="popover" [interfaceOptions]="customPopoverOptions">
                    <ion-select-option value="Certificate">Certificate</ion-select-option>
                    <ion-select-option value="Permit">Permit</ion-select-option>
                    <ion-select-option value="Payment">Payment</ion-select-option>
                </ion-select>
            </ion-item>

            <ion-item>
                <ion-label position="stacked">Processing Time *</ion-label>
                <ion-input [(ngModel)]="formData.processingTime" name="processingTime"
                    placeholder="e.g., 3-5 business days" required>
                </ion-input>
            </ion-item>

            <ion-item>
                <ion-label position="stacked">Fee (₱) *</ion-label>
                <ion-input [(ngModel)]="formData.fee" name="fee" type="number" min="0" step="0.01" placeholder="0.00"
                    required>
                </ion-input>
            </ion-item>
        </ion-list>

        <!-- Requirements -->
        <ion-list>
            <ion-list-header>
                <ion-label>Requirements</ion-label>
            </ion-list-header>

            <ion-item lines="none">
                <ion-button (click)="addRequirement()" size="small" fill="outline" slot="start">
                    <ion-icon name="add" slot="start"></ion-icon>
                    Add Requirement
                </ion-button>
            </ion-item>

            <ion-item *ngIf="requirementsList.length === 0">
                <ion-label class="ion-text-wrap" color="medium">
                    <p>No requirements added yet.</p>
                </ion-label>
            </ion-item>

            <ion-item *ngFor="let req of requirementsList; let i = index">
                <ion-label position="stacked">Requirement {{ i + 1 }}</ion-label>
                <ion-select [(ngModel)]="req.selectValue" [name]="'requirement_select_' + i"
                    placeholder="Select requirement" required interface="alert">
                    <ion-select-option *ngFor="let option of predefinedRequirements" [value]="option">
                        {{ option }}
                    </ion-select-option>
                    <ion-select-option value="Other">Other</ion-select-option>
                </ion-select>

                <ion-input *ngIf="req.selectValue === 'Other'" [(ngModel)]="req.customValue"
                    [name]="'requirement_custom_' + i" placeholder="Enter specific requirement" class="ion-margin-top"
                    required>
                </ion-input>

                <ion-button slot="end" fill="clear" color="danger" (click)="removeRequirement(i)">
                    <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
                </ion-button>
            </ion-item>
        </ion-list>
    </form>
</div>

<ion-footer>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-button (click)="dismiss()" fill="clear">Cancel</ion-button>
        </ion-buttons>
        <ion-buttons slot="end">
            <ion-button (click)="save()" [disabled]="!isFormValid()" color="primary" fill="solid">
                <ion-icon name="save-outline" slot="start"></ion-icon>
                Save Service
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-footer>
