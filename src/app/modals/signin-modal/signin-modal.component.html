<ion-header class="ion-no-border modal-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()" class="close-btn">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Sign In</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="modal-content">
  <div class="signin-container">
    <!-- Header -->
    <div class="header-section">
      <div class="header-icon-wrapper">
        <ion-icon name="business-outline"></ion-icon>
      </div>

      <h2>Welcome Back</h2>
      <p>Sign in to access Cabanatuan e-Serbisyo</p>
    </div>

    <!-- Form -->
    <form class="signin-form">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrapper">
          <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          <ion-input
            type="email"
            placeholder="you@example.com"
            [(ngModel)]="loginData.email"
            name="email"
            class="custom-input"
          ></ion-input>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrapper">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <ion-input
            type="password"
            placeholder="Enter your password"
            [(ngModel)]="loginData.password"
            name="password"
            class="custom-input"
          ></ion-input>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Sign in as</label>
        <div class="role-options">
          <label class="role-option" [class.selected]="loginData.role === 'user'">
            <input type="radio" name="role" value="user" [(ngModel)]="loginData.role">
            <div class="role-content">
              <ion-icon name="person-outline"></ion-icon>
              <span>Regular User</span>
            </div>
          </label>
          <label class="role-option" [class.selected]="loginData.role === 'admin'">
            <input type="radio" name="role" value="admin" [(ngModel)]="loginData.role">
            <div class="role-content">
              <ion-icon name="shield-checkmark-outline"></ion-icon>
              <span>Admin Staff</span>
            </div>
          </label>
        </div>
      </div>

      <ion-button 
        expand="block" 
        class="submit-btn"
        (click)="handleSignIn()"
        [disabled]="loading"
      >
        <ion-spinner name="crescent" *ngIf="loading"></ion-spinner>
        <span *ngIf="!loading">Sign In</span>
      </ion-button>

      <a class="forgot-link" (click)="handleForgotPassword()">Forgot your password?</a>

    </form>

    <!-- Test Credentials -->
    <div class="credentials-card">
      <div class="credentials-header">
        <ion-icon name="information-circle-outline"></ion-icon>
        <span>Test Credentials</span>
      </div>
      <div class="credentials-body">
        <div class="credential-row">
          <span class="credential-label">Email:</span>
          <code class="credential-value">admin@city.gov</code>
        </div>
        <div class="credential-row">
          <span class="credential-label">Password:</span>
          <code class="credential-value">123456</code>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <p>
        Don't have an account? <a (click)="switchToSignUp()">Sign Up</a>
      </p>
    </div>

  </div>
</ion-content>
